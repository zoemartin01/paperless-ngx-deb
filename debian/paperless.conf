# Paperless-ngx configuration
# Docs: https://docs.paperless-ngx.com/configuration/

# Redis (required)
PAPERLESS_REDIS=redis://localhost:6379

# Database
# Default: SQLite in /var/lib/paperless/data/db.sqlite3
#PAPERLESS_DBHOST=localhost
#PAPERLESS_DBPORT=5432
#PAPERLESS_DBNAME=paperless
#PAPERLESS_DBUSER=paperless
#PAPERLESS_DBPASS=paperless
#PAPERLESS_DBSSLMODE=prefer

# ---- Paths and folders ----
PAPERLESS_CONSUMPTION_DIR=/var/lib/paperless/consume
PAPERLESS_DATA_DIR=/var/lib/paperless/data
PAPERLESS_MEDIA_ROOT=/var/lib/paperless/media
PAPERLESS_STATICDIR=/var/lib/paperless/static
PAPERLESS_CONVERT_TMPDIR=/var/tmp/paperless

# Optional: empty trash dir
#PAPERLESS_EMPTY_TRASH_DIR=/var/lib/paperless/trash

# ---- Security and hosting ----

PAPERLESS_SECRET_KEY=

# Local-only defaults. Reverse proxy users should set PAPERLESS_URL and hosts.
#PAPERLESS_URL=https://paperless.example.com
#PAPERLESS_FORCE_SCRIPT_NAME=
#PAPERLESS_CSRF_TRUSTED_ORIGINS=
#PAPERLESS_ALLOWED_HOSTS=
#PAPERLESS_CORS_ALLOWED_HOSTS=

PAPERLESS_BIND_ADDR=127.0.0.1
PAPERLESS_PORT=8000
PAPERLESS_WEBSERVER_WORKERS=2

# Cookies (optional)
#PAPERLESS_COOKIE_PREFIX=

# ---- OCR settings ----
PAPERLESS_OCR_LANGUAGE=eng

# ---- Software tweaks ----
PAPERLESS_TIME_ZONE=Europe/Berlin
#PAPERLESS_TASK_WORKERS=1
#PAPERLESS_THREADS_PER_WORKER=1

# ---- Binaries ----
#PAPERLESS_CONVERT_BINARY=/usr/bin/convert
#PAPERLESS_GS_BINARY=/usr/bin/gs

